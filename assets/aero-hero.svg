<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Terminal Window Fill -->
    <linearGradient id="terminalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050a14" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Cyber Neon Border -->
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="terminalGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-title {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.5px;
      fill: url(#titleGrad);
    }
    .mono-code {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-size: 13.5px;
      fill: #cbd5e1;
    }
    .mono-accent {
      fill: #00f0ff;
      font-weight: 600;
    }
    .mono-purple {
      fill: #c084fc;
      font-weight: 600;
    }
    .mono-dim {
      fill: #64748b;
    }
    .hud-tag {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1px;
      fill: #00f0ff;
    }
    .hud-badge-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 500;
      font-size: 11.5px;
      fill: #f1f5f9;
    }
    .cursor-blink {
      animation: blink 1.2s infinite;
    }
    .scan-drift {
      animation: scanAnim 8s linear infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanAnim {
      0% { transform: translateY(0px); }
      100% { transform: translateY(20px); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="260" rx="14" fill="url(#bgGrad)"/>

  <!-- Background Grid -->
  <rect width="960" height="260" rx="14" fill="url(#terminalGrid)"/>

  <!-- Ambient Corner Neon Accent Lines -->
  <path d="M 2 24 L 2 2 L 24 2" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 958 24 L 958 2 L 936 2" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.8"/>
  <path d="M 2 236 L 2 258 L 24 258" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 958 236 L 958 258 L 936 258" fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.8"/>

  <!-- Terminal Window Panel -->
  <rect x="24" y="20" width="912" height="220" rx="10" fill="url(#terminalBg)"/>
  <rect x="24" y="20" width="912" height="220" rx="10" fill="none" stroke="url(#cyberBorder)" stroke-width="1.2"/>

  <!-- Scanline Overlay -->
  <rect x="24" y="20" width="912" height="220" rx="10" fill="url(#scanlines)" pointer-events="none"/>

  <!-- Terminal Title Bar -->
  <rect x="24" y="20" width="912" height="34" rx="10" fill="#0f172a" fill-opacity="0.8"/>
  <line x1="24" y1="54" x2="936" y2="54" stroke="#1e293b" stroke-width="1"/>

  <!-- Terminal Controls -->
  <circle cx="46" cy="37" r="5" fill="#ef4444" opacity="0.85"/>
  <circle cx="64" cy="37" r="5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="82" cy="37" r="5" fill="#10b981" opacity="0.85"/>

  <!-- Terminal Header Title -->
  <text x="108" y="41" class="mono-dim" font-size="11" font-family="'SF Mono', Consolas, monospace">terminal://peakcoder@session: active [bash]</text>

  <!-- Top Right Status Badge -->
  <g transform="translate(760, 27)">
    <rect width="152" height="20" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="0.8"/>
    <circle cx="12" cy="10" r="3" fill="#00f0ff"/>
    <text x="24" y="14" class="hud-tag">STATUS: ONLINE</text>
  </g>

  <!-- Main Terminal Body -->
  <g transform="translate(52, 92)">
    <text x="0" y="0" class="mono-title">GHisDW <tspan font-weight="300" font-size="24" fill="#64748b">::</tspan> <tspan font-weight="600" font-size="28" fill="#38bdf8">peakcoder</tspan></text>

    <!-- Shell Prompts & Description -->
    <text x="0" y="32" class="mono-code">
      <tspan class="mono-dim">$</tspan> <tspan class="mono-accent">arch --focus</tspan>
      <tspan fill="#94a3b8"> &gt; Desktop Applications &amp; Developer Automation</tspan>
    </text>
    <text x="0" y="54" class="mono-code">
      <tspan class="mono-dim">$</tspan> <tspan class="mono-purple">cat core.json</tspan>
      <tspan fill="#94a3b8"> &gt; ["Node.js", "Python", "TypeScript", "Electron"]</tspan>
    </text>
    <text x="0" y="76" class="mono-code">
      <tspan class="mono-dim">&gt;</tspan> <tspan fill="#38bdf8">Flagship:</tspan> <tspan fill="#f1f5f9">Voxel⁺</tspan> <tspan class="mono-dim">—</tspan> <tspan fill="#94a3b8">Moddable offline-first Minecraft instance manager</tspan>
      <tspan class="cursor-blink" fill="#00f0ff">_</tspan>
    </text>
  </g>

  <!-- Right HUD Data Chips -->
  <g transform="translate(685, 78)">
    <!-- Chip 1: Core Stack -->
    <g transform="translate(0, 0)">
      <rect width="225" height="34" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="0.8"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#00f0ff"/>
      <text x="14" y="14" class="hud-tag" font-size="9.5">CORE RUNTIMES</text>
      <text x="14" y="28" class="hud-badge-text">Node.js · Python</text>
    </g>

    <!-- Chip 2: Desktop & System -->
    <g transform="translate(0, 44)">
      <rect width="225" height="34" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.3" stroke-width="0.8"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#a855f7"/>
      <text x="14" y="14" class="hud-tag" font-size="9.5" fill="#c084fc">DESKTOP &amp; CLIENT</text>
      <text x="14" y="28" class="hud-badge-text">Electron · TypeScript · Vite</text>
    </g>

    <!-- Chip 3: Integrations & Tooling -->
    <g transform="translate(0, 88)">
      <rect width="225" height="34" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.8"/>
      <rect x="0" y="0" width="4" height="34" rx="2" fill="#38bdf8"/>
      <text x="14" y="14" class="hud-tag" font-size="9.5" fill="#38bdf8">INTEGRATIONS</text>
      <text x="14" y="28" class="hud-badge-text">Discord API · Fabric Tooling</text>
    </g>
  </g>
</svg>
