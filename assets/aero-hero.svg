<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111c38"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>

    <!-- Translucent Glass Fill -->
    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Glass Rim / Specular Highlight -->
    <linearGradient id="glassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="35%" stop-color="#93c5fd" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#c4b5fd" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Text Highlight Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#e0f2fe"/>
      <stop offset="75%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>

    <!-- Flowing Aurora Ribbon 1 -->
    <linearGradient id="aurora1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Flowing Aurora Ribbon 2 -->
    <linearGradient id="aurora2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Ambient Lights -->
    <radialGradient id="orbCyan" cx="20%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbLavender" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#a78bfa" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbWhite" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle blur filter -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: url(#titleGrad);
    }
    .badge-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      fill: #e0f2fe;
    }
    .desc-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 15px;
      line-height: 1.5;
      fill: #cbd5e1;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 12.5px;
      fill: #f1f5f9;
    }
    .wave-float1 {
      animation: drift1 14s ease-in-out infinite alternate;
    }
    .wave-float2 {
      animation: drift2 18s ease-in-out infinite alternate;
    }
    @keyframes drift1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-30px, 12px) scale(1.04); }
    }
    @keyframes drift2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(35px, -15px) scale(0.98); }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="260" rx="20" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <rect width="960" height="260" rx="20" fill="url(#orbCyan)"/>
  <rect width="960" height="260" rx="20" fill="url(#orbLavender)"/>
  <rect width="960" height="260" rx="20" fill="url(#orbWhite)"/>

  <!-- Liquid Animated Waves / Ribbons in Background -->
  <g class="wave-float1">
    <path d="M-40,160 C180,80 340,240 560,140 C780,40 880,180 1020,110 L1020,300 L-40,300 Z" fill="url(#aurora1)"/>
  </g>
  <g class="wave-float2">
    <path d="M-60,70 C160,190 380,40 600,160 C800,280 890,70 1040,170 L1040,300 L-60,300 Z" fill="url(#aurora2)"/>
  </g>

  <!-- Foreground Aero Glass Panel -->
  <rect x="28" y="24" width="904" height="212" rx="16" fill="url(#glassFill)"/>
  <rect x="28" y="24" width="904" height="212" rx="16" fill="none" stroke="url(#glassRim)" stroke-width="1.2"/>

  <!-- Status / Pill Header in Glass Panel -->
  <g transform="translate(56, 48)">
    <!-- Small Status Pill -->
    <rect width="135" height="26" rx="13" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.25" stroke-width="0.8"/>
    <circle cx="14" cy="13" r="3.5" fill="#38bdf8"/>
    <text x="26" y="17" class="badge-label">Developer Profile</text>
  </g>

  <!-- Main Hero Content -->
  <g transform="translate(56, 110)">
    <text x="0" y="0" class="name-title">GHisDW <tspan font-weight="300" font-size="28" fill="#94a3b8">/ peakcoder</tspan></text>
    <text x="0" y="32" class="desc-text">Engineering desktop applications and thoughtful tools with Node.js, Python, and TypeScript.</text>
    <text x="0" y="56" class="desc-text" fill="#94a3b8">Creator of Voxel⁺ · Clean architecture · Offline-first instance management</text>
  </g>

  <!-- Right Floating Glass Pill Badges -->
  <g transform="translate(680, 50)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="url(#glassRim)" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="4.5" fill="#38bdf8"/>
      <text x="34" y="22" class="pill-text">Node.js &amp; Python Core</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(10, 48)">
      <rect width="210" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="url(#glassRim)" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="4.5" fill="#a78bfa"/>
      <text x="34" y="22" class="pill-text">Electron &amp; TypeScript</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(20, 96)">
      <rect width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="url(#glassRim)" stroke-width="0.8"/>
      <circle cx="20" cy="18" r="4.5" fill="#6ee7b7"/>
      <text x="34" y="22" class="pill-text">Voxel⁺ Minecraft Launcher</text>
    </g>
  </g>
</svg>
