<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 24" fill="none" width="100%" height="24">
  <defs>
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="55%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>
    <filter id="cyberGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    @keyframes pulseGlow {
      0% { opacity: 0.4; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #00f0ff); }
    }
  </style>

  <!-- Background guide faint line -->
  <line x1="50" y1="12" x2="950" y2="12" stroke="#00f0ff" stroke-opacity="0.15" stroke-width="1" />

  <!-- Core Neon Line -->
  <line x1="120" y1="12" x2="880" y2="12" stroke="url(#cyberLineGrad)" stroke-width="2" filter="url(#cyberGlow)" />

  <!-- Left Accent Nodes -->
  <polygon points="260,12 268,7 276,12 268,17" fill="#00f0ff" fill-opacity="0.6" />
  <circle cx="200" cy="12" r="2.5" fill="#00f0ff" opacity="0.8" />
  <circle cx="160" cy="12" r="1.5" fill="#38bdf8" opacity="0.5" />

  <!-- Center Diamond & Hub -->
  <g class="pulse-node">
    <rect x="494" y="6" width="12" height="12" rx="2" fill="#0a0f1d" stroke="#00f0ff" stroke-width="1.5" transform="rotate(45 500 12)" />
    <circle cx="500" cy="12" r="2.5" fill="#a855f7" />
  </g>
  <line x1="470" y1="8" x2="482" y2="8" stroke="#00f0ff" stroke-width="1" opacity="0.7" />
  <line x1="518" y1="16" x2="530" y2="16" stroke="#00f0ff" stroke-width="1" opacity="0.7" />

  <!-- Right Accent Nodes -->
  <polygon points="724,12 732,7 740,12 732,17" fill="#00f0ff" fill-opacity="0.6" />
  <circle cx="800" cy="12" r="2.5" fill="#00f0ff" opacity="0.8" />
  <circle cx="840" cy="12" r="1.5" fill="#38bdf8" opacity="0.5" />
</svg>
