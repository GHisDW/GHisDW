<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 28" width="100%" height="28" fill="none">
  <defs>
    <!-- Base Neon Gradient -->
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanning Laser Pulse -->
    <linearGradient id="laserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-beam {
      animation: scanLaser 4s ease-in-out infinite alternate;
    }
    .node-blink {
      animation: cyberBlink 2.5s ease-in-out infinite;
    }
    @keyframes scanLaser {
      0% { transform: translateX(80px); opacity: 0.3; }
      50% { opacity: 1; }
      100% { transform: translateX(720px); opacity: 0.3; }
    }
    @keyframes cyberBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>

  <!-- Background Subtle Grid Track -->
  <line x1="40" y1="14" x2="920" y2="14" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 6"/>

  <!-- Main Cyber Circuit / Laser Line -->
  <path d="M 60 14 L 380 14 L 400 6 L 560 6 L 580 14 L 900 14"
        stroke="url(#cyberLineGrad)"
        stroke-width="1.8"
        stroke-linecap="round"
        filter="url(#neonGlow)"/>

  <!-- Center Hexagonal / Diamond Core Marker -->
  <polygon points="480,2 485,6 480,10 475,6" fill="#00f0ff" class="node-blink"/>
  <circle cx="480" cy="6" r="1.5" fill="#ffffff"/>

  <!-- Flanking Tech Points -->
  <circle cx="400" cy="6" r="2.5" fill="#a855f7" class="node-blink"/>
  <circle cx="560" cy="6" r="2.5" fill="#38bdf8" class="node-blink"/>
  <line x1="420" y1="6" x2="440" y2="6" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="520" y1="6" x2="540" y2="6" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Scanning Pulse Ray -->
  <g class="pulse-beam">
    <ellipse cx="0" cy="14" rx="45" ry="2" fill="url(#laserPulse)" filter="url(#neonGlow)"/>
  </g>
</svg>
