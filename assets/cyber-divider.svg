<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 32" width="100%" height="32" fill="none">
  <defs>
    <!-- Background Track Gradient -->
    <linearGradient id="divBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanline Pulse Animation -->
    <linearGradient id="scanPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="200%" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="300%" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-dot {
      animation: pulseAnim 2s infinite ease-in-out;
    }
    @keyframes pulseAnim {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .hud-text {
      font-family: 'SF Pro Display', -apple-system, 'Segoe UI', Roboto, 'Courier New', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #38bdf8;
      opacity: 0.6;
    }
  </style>

  <!-- Left Cyber Accents -->
  <line x1="80" y1="16" x2="220" y2="16" stroke="url(#divBg)" stroke-width="1.5"/>
  <rect x="220" y="14" width="4" height="4" fill="#00f0ff" opacity="0.8"/>
  <line x1="228" y1="16" x2="260" y2="16" stroke="#00f0ff" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>

  <!-- Center Active Bus -->
  <line x1="270" y1="16" x2="690" y2="16" stroke="url(#divBg)" stroke-width="1.5"/>
  <line x1="270" y1="16" x2="690" y2="16" stroke="url(#scanPulse)" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Center Diamond HUD Anchor -->
  <g transform="translate(480, 16)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#0a0f1d" stroke="#00f0ff" stroke-width="1.5" filter="url(#neonGlow)"/>
    <polygon points="0,-2.5 2.5,0 0,2.5 -2.5,0" fill="#a855f7"/>
  </g>

  <!-- Right Cyber Accents -->
  <line x1="700" y1="16" x2="732" y2="16" stroke="#a855f7" stroke-width="1" stroke-dasharray="2,3" opacity="0.6"/>
  <rect x="736" y="14" width="4" height="4" fill="#a855f7" opacity="0.8"/>
  <line x1="744" y1="16" x2="880" y2="16" stroke="url(#divBg)" stroke-width="1.5"/>

  <!-- Minor Decorative Bits -->
  <circle cx="280" cy="16" r="1.5" fill="#00f0ff" class="pulse-dot"/>
  <circle cx="680" cy="16" r="1.5" fill="#a855f7" class="pulse-dot"/>
</svg>
