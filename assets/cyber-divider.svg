<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 30" width="100%" height="30" fill="none">
  <defs>
    <linearGradient id="cyberLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background guide line -->
  <line x1="50" y1="15" x2="800" y2="15" stroke="url(#cyberLineGrad)" stroke-width="1.5" />

  <!-- Digital Accent Nodes -->
  <circle cx="250" cy="15" r="2.5" fill="#00f2fe" opacity="0.6" />
  <circle cx="600" cy="15" r="2.5" fill="#a855f7" opacity="0.6" />

  <!-- Center Diamond & Chevron Embellishment -->
  <g transform="translate(425, 15)" filter="url(#glow)">
    <polygon points="0,-6 6,0 0,6 -6,0" fill="#030712" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="1.5" fill="#38bdf8" />
    <path d="M-18,-4 L-12,0 L-18,4" stroke="#00f2fe" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    <path d="M18,-4 L12,0 L18,4" stroke="#a855f7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
  </g>
</svg>
