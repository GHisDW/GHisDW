<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 24" width="100%" height="24" fill="none">
  <defs>
    <linearGradient id="cyberLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f5ff" stop-opacity="0.3"/>
      <stop offset="45%" stop-color="#00f5ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#a855f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: scanAnim 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .laser-glow {
      animation: laserPulse 2.5s ease-in-out infinite alternate;
    }
    @keyframes scanAnim {
      0% { transform: translateX(0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(960px); opacity: 0; }
    }
    @keyframes laserPulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.95; }
    }
  </style>

  <!-- Base Grid Lines -->
  <line x1="0" y1="12" x2="960" y2="12" stroke="url(#cyberLine)" stroke-width="1.2" class="laser-glow" filter="url(#neonGlow)"/>
  <line x1="320" y1="12" x2="640" y2="12" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.9"/>

  <!-- Left Accent Terminal Marker -->
  <polygon points="260,8 270,12 260,16" fill="#00f5ff" opacity="0.8"/>
  <rect x="230" y="11" width="22" height="2" fill="#00f5ff" opacity="0.5"/>
  <circle cx="215" cy="12" r="2" fill="#00f5ff" opacity="0.7"/>

  <!-- Center Hex/Diamond Motif -->
  <polygon points="480,5 487,12 480,19 473,12" fill="#050814" stroke="#00f5ff" stroke-width="1.5" filter="url(#neonGlow)"/>
  <circle cx="480" cy="12" r="2" fill="#ffffff"/>

  <!-- Center Decorative Brackets -->
  <path d="M450 7 L460 7 L465 12 L460 17 L450 17" fill="none" stroke="#00f5ff" stroke-width="1.2" opacity="0.7"/>
  <path d="M510 7 L500 7 L495 12 L500 17 L510 17" fill="none" stroke="#a855f7" stroke-width="1.2" opacity="0.7"/>

  <!-- Right Accent Terminal Marker -->
  <polygon points="700,8 690,12 700,16" fill="#a855f7" opacity="0.8"/>
  <rect x="708" y="11" width="22" height="2" fill="#a855f7" opacity="0.5"/>
  <circle cx="745" cy="12" r="2" fill="#a855f7" opacity="0.7"/>

  <!-- Scanning Photon Pulse -->
  <g class="pulse-node">
    <circle cx="0" cy="12" r="3.5" fill="#00f5ff" filter="url(#neonGlow)"/>
    <circle cx="0" cy="12" r="1.5" fill="#ffffff"/>
  </g>
</svg>
