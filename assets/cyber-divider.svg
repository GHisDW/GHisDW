<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 36" width="100%" height="36" fill="none">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="15%" stop-color="#00f3ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="1"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#00f3ff" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .glow-pulse {
      animation: neonPulse 3s ease-in-out infinite alternate;
    }
    @keyframes neonPulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background Soft Glow -->
  <line x1="80" y1="18" x2="880" y2="18" stroke="url(#glowLine)" stroke-width="6" opacity="0.4" class="glow-pulse"/>

  <!-- Main Divider Line -->
  <line x1="40" y1="18" x2="920" y2="18" stroke="url(#divGrad)" stroke-width="1.5"/>

  <!-- Left Accent Dots & Chevrons -->
  <g transform="translate(180, 14)">
    <polygon points="0,4 6,0 6,8" fill="#00f3ff" opacity="0.8"/>
    <polygon points="10,4 16,0 16,8" fill="#00f3ff" opacity="0.5"/>
    <circle cx="28" cy="4" r="2" fill="#00f3ff"/>
    <line x1="38" y1="4" x2="70" y2="4" stroke="#00f3ff" stroke-width="1" stroke-dasharray="2 3"/>
  </g>

  <!-- Center Cyber Node Diamond -->
  <g transform="translate(480, 18)">
    <rect x="-14" y="-7" width="28" height="14" rx="2" fill="#030712" stroke="#a855f7" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="3.5" fill="#00f3ff"/>
    <circle cx="0" cy="0" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Right Accent Dots & Chevrons -->
  <g transform="translate(710, 14)">
    <line x1="0" y1="4" x2="32" y2="4" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="42" cy="4" r="2" fill="#38bdf8"/>
    <polygon points="54,0 60,4 54,8" fill="#38bdf8" opacity="0.5"/>
    <polygon points="64,0 70,4 64,8" fill="#38bdf8" opacity="0.8"/>
  </g>
</svg>
