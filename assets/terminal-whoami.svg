<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="auto">
  <defs>
    <!-- Dark Slate/Obsidian Terminal Background -->
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="termScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Terminal Header Gradient -->
    <linearGradient id="termHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <style>
    .mono {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', 'JetBrains Mono', Consolas;
    }
    .cmd {
      font-size: 13.5px;
      fill: #00f3ff;
      font-weight: 700;
    }
    .prompt {
      font-size: 13.5px;
      fill: #34d399;
      font-weight: 700;
    }
    .key {
      font-size: 13px;
      fill: #38bdf8;
    }
    .val-str {
      font-size: 13px;
      fill: #cbd5e1;
    }
    .val-highlight {
      font-size: 13px;
      fill: #a855f7;
      font-weight: 700;
    }
    .val-green {
      font-size: 13px;
      fill: #34d399;
      font-weight: 600;
    }
    .cursor {
      animation: blink 1s step-start infinite;
    }
    @keyframes blink {
      50% { opacity: 0; }
    }
  </style>

  <!-- Terminal Window Container -->
  <rect width="960" height="270" rx="10" fill="url(#termBg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Terminal Window Header -->
  <rect width="960" height="34" rx="10" fill="url(#termHeader)"/>
  <rect y="24" width="960" height="10" fill="url(#termHeader)"/>
  <line x1="0" y1="34" x2="960" y2="34" stroke="#334155" stroke-width="0.8"/>

  <!-- Window Control Dots -->
  <circle cx="24" cy="17" r="5" fill="#ef4444" opacity="0.8"/>
  <circle cx="42" cy="17" r="5" fill="#eab308" opacity="0.8"/>
  <circle cx="60" cy="17" r="5" fill="#22c55e" opacity="0.8"/>

  <!-- Title in Header -->
  <text x="480" y="22" text-anchor="middle" class="mono" font-size="12" fill="#94a3b8" font-weight="600">terminal://peakcoder@cyberdeck ~ whoami</text>

  <!-- Terminal Session Output -->
  <g transform="translate(32, 60)" class="mono">
    <!-- Command 1: whoami -->
    <text x="0" y="0"><tspan class="prompt">root@ghisdw:~$</tspan> <tspan class="cmd">whoami --verbose</tspan></text>
    <text x="0" y="20" class="val-str">GHisDW (peakcoder) · Software Developer &amp; Systems Builder</text>

    <!-- Command 2: cat specs.json -->
    <text x="0" y="48"><tspan class="prompt">root@ghisdw:~$</tspan> <tspan class="cmd">cat &lt;&lt; 'EOF' &gt; profile.json</tspan></text>

    <!-- JSON Structure -->
    <text x="0" y="70" fill="#64748b">{</text>
    <text x="24" y="90"><tspan class="key">"core_strengths"</tspan><tspan fill="#64748b">: [</tspan><tspan class="val-highlight">"Node.js"</tspan><tspan fill="#64748b">, </tspan><tspan class="val-highlight">"Python"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="24" y="110"><tspan class="key">"technologies"</tspan><tspan fill="#64748b">:   [</tspan><tspan class="val-str">"TypeScript", "JavaScript", "Electron", "Vite", "Git/GitHub"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="24" y="130"><tspan class="key">"domains"</tspan><tspan fill="#64748b">:        [</tspan><tspan class="val-str">"Desktop Applications", "Discord Bots", "Minecraft Modding (Beginner)"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="24" y="150"><tspan class="key">"flagship_project"</tspan><tspan fill="#64748b">:</tspan> <tspan class="val-green">"Voxel⁺ (Isolated Minecraft Launcher)"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="24" y="170"><tspan class="key">"status"</tspan><tspan fill="#64748b">:          </tspan><tspan fill="#00f3ff">"ACTIVE_DEVELOPMENT // SYSTEM_READY"</tspan></text>
    <text x="0" y="190" fill="#64748b">}</text>

    <!-- Active Command Prompt -->
    <text x="0" y="218"><tspan class="prompt">root@ghisdw:~$</tspan> <tspan fill="#e2e8f0">./deploy_profile --mode=production</tspan> <tspan fill="#00f3ff" class="cursor">█</tspan></text>
  </g>

  <!-- Overlay Scanlines -->
  <rect width="960" height="270" rx="10" fill="url(#termScan)" pointer-events="none"/>
</svg>
