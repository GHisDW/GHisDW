<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18"/>
      <stop offset="50%" stop-color="#0b1325"/>
      <stop offset="100%" stop-color="#080e1c"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="vBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Spec Pill Gradient -->
    <linearGradient id="vPillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="vCyanGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vPurpleGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="vScanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-opacity="0.25" stroke-width="1.2"/>
    </pattern>

    <!-- Grid Pattern -->
    <pattern id="vGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#38bdf8" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    .font-mono {
      font-family: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, 'Liberation Mono', Menlo, monospace;
    }
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .v-title {
      font-weight: 800;
      font-size: 26px;
      letter-spacing: -0.3px;
      fill: #ffffff;
    }
    .v-tagline {
      font-weight: 600;
      font-size: 13.5px;
      fill: #38bdf8;
      letter-spacing: 0.2px;
    }
    .v-desc {
      font-weight: 400;
      font-size: 13px;
      line-height: 1.5;
      fill: #cbd5e1;
    }
    .v-header-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      fill: #94a3b8;
    }
    .v-body-val {
      font-size: 12px;
      font-weight: 600;
      fill: #f1f5f9;
    }
    .v-chip-label {
      font-size: 11px;
      font-weight: 500;
      fill: #e2e8f0;
    }
    .pulse-indicator {
      animation: pulseV 3s ease-in-out infinite;
    }
    @keyframes pulseV {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 4px #38bdf8); }
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="260" rx="14" fill="url(#vCardBg)"/>
  <rect width="960" height="260" rx="14" fill="url(#vGrid)"/>

  <!-- Ambient Glows -->
  <rect width="960" height="260" rx="14" fill="url(#vCyanGlow)"/>
  <rect width="960" height="260" rx="14" fill="url(#vPurpleGlow)"/>

  <!-- Card Border -->
  <rect x="18" y="16" width="924" height="228" rx="12" fill="none" stroke="url(#vBorderGrad)" stroke-width="1.2"/>

  <!-- Scanlines inside Card -->
  <rect x="19" y="17" width="922" height="226" rx="11" fill="url(#vScanlines)" pointer-events="none"/>

  <!-- Top Cyber Status Bar in Card -->
  <g transform="translate(36, 30)">
    <text x="0" y="0" class="font-mono" font-size="10" font-weight="700" fill="#818cf8" letter-spacing="1">PROJECT://VOXELPLUS — FLAGSHIP DESKTOP RUNTIME</text>
    <line x1="0" y1="8" x2="888" y2="8" stroke="#1e293b" stroke-width="1"/>
  </g>

  <!-- App Logo / Icon Box -->
  <g transform="translate(36, 52)">
    <rect width="98" height="98" rx="14" fill="#090e1a" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1"/>
    <!-- Cyber corner marks on icon box -->
    <path d="M 0 0 L 8 0 L 0 8 Z" fill="#38bdf8"/>
    <path d="M 98 98 L 90 98 L 98 90 Z" fill="#818cf8"/>
    <image href="data:image/png;base64," x="7" y="7" width="84" height="84" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Title & Description Header -->
  <g transform="translate(154, 52)">
    <text x="0" y="22" class="font-sans v-title">Voxel⁺ <tspan font-weight="400" font-size="15" fill="#94a3b8">— Isolated Minecraft Instance Launcher</tspan></text>
    <text x="0" y="44" class="font-mono v-tagline">&gt; Desktop application engineered for clean, moddable singleplayer instances</text>
    <text x="0" y="66" class="font-sans v-desc">Dedicated configs, mod directories, and Gradle environments per instance to prevent version pollution.</text>

    <!-- Tech Specs HUD Boxes -->
    <g transform="translate(0, 84)">
      <!-- Spec 1: Architecture -->
      <g transform="translate(0, 0)">
        <rect width="235" height="42" rx="6" fill="url(#vPillBg)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="0.8"/>
        <text x="12" y="16" class="font-mono v-header-label">ARCHITECTURE</text>
        <text x="12" y="32" class="font-sans v-body-val" fill="#38bdf8">Electron · Vite · TypeScript</text>
      </g>

      <!-- Spec 2: Loaders -->
      <g transform="translate(247, 0)">
        <rect width="245" height="42" rx="6" fill="url(#vPillBg)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="0.8"/>
        <text x="12" y="16" class="font-mono v-header-label">LOADER MATRIX</text>
        <text x="12" y="32" class="font-sans v-body-val" fill="#a78bfa">Fabric · Quilt · Forge · NeoForge</text>
      </g>

      <!-- Spec 3: Discovery & Runtime -->
      <g transform="translate(504, 0)">
        <rect width="264" height="42" rx="6" fill="url(#vPillBg)" stroke="#10b981" stroke-opacity="0.3" stroke-width="0.8"/>
        <text x="12" y="16" class="font-mono v-header-label">DISCOVERY &amp; RUNTIME</text>
        <text x="12" y="32" class="font-sans v-body-val" fill="#34d399">Modrinth Discovery · Java Detection</text>
      </g>
    </g>
  </g>

  <!-- Bottom Capability Chips -->
  <g transform="translate(36, 194)">
    <!-- Chip 1: Offline Execution -->
    <g transform="translate(0, 0)">
      <rect width="195" height="28" rx="5" fill="#090e1a" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#38bdf8" class="pulse-indicator"/>
      <text x="25" y="18" class="font-sans v-chip-label">Offline Instance Launching</text>
    </g>

    <!-- Chip 2: Per-instance Loom -->
    <g transform="translate(207, 0)">
      <rect width="215" height="28" rx="5" fill="#090e1a" stroke="#818cf8" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#818cf8"/>
      <text x="25" y="18" class="font-sans v-chip-label">Per-Instance Loom &amp; Gradle</text>
    </g>

    <!-- Chip 3: Modpack Engine -->
    <g transform="translate(434, 0)">
      <rect width="220" height="28" rx="5" fill="#090e1a" stroke="#10b981" stroke-opacity="0.5" stroke-width="0.8"/>
      <circle cx="14" cy="14" r="3" fill="#10b981"/>
      <text x="25" y="18" class="font-sans v-chip-label">.mrpack &amp; .vpack Import Engine</text>
    </g>

    <!-- Chip 4: Explore Repo Action -->
    <g transform="translate(666, 0)">
      <rect width="238" height="28" rx="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="36" y="18" class="font-mono v-chip-label" font-weight="700" fill="#38bdf8">[EXPLORE REPOSITORY ↗]</text>
    </g>
  </g>
</svg>
