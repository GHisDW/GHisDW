<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0a1128"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="cyberRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Panel Fill -->
    <linearGradient id="panelFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.35"/>
    </pattern>

    <!-- Tech Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.5"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono-title {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .badge-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      fill: #00f0ff;
    }
    .summary-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 14.5px;
      line-height: 1.5;
      fill: #94a3b8;
    }
    .feature-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 500;
      font-size: 12px;
      fill: #e2e8f0;
    }
    .accent-cyan { fill: #00f0ff; }
    .accent-purple { fill: #c084fc; }

    .scan-beam {
      animation: scanVertical 6s linear infinite;
    }
    .status-pulse {
      animation: blink 2s infinite ease-in-out;
    }
    @keyframes scanVertical {
      0% { transform: translateY(0px); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { transform: translateY(240px); opacity: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
  </style>

  <!-- Base Dark Canvas -->
  <rect width="960" height="260" rx="14" fill="url(#bgGrad)"/>

  <!-- Tech Grid Background -->
  <rect width="960" height="260" rx="14" fill="url(#techGrid)"/>

  <!-- Cyberpunk Terminal Outer Card -->
  <rect x="20" y="16" width="920" height="228" rx="12" fill="url(#panelFill)"/>
  <rect x="20" y="16" width="920" height="228" rx="12" fill="none" stroke="url(#cyberRim)" stroke-width="1.4"/>

  <!-- Scanlines Overlay -->
  <rect x="20" y="16" width="920" height="228" rx="12" fill="url(#scanlines)"/>

  <!-- Top Terminal Header Bar -->
  <g transform="translate(42, 38)">
    <!-- Terminal Controls -->
    <circle cx="0" cy="0" r="4.5" fill="#ef4444"/>
    <circle cx="15" cy="0" r="4.5" fill="#eab308"/>
    <circle cx="30" cy="0" r="4.5" fill="#22c55e"/>

    <text x="50" y="4" class="badge-text" fill="#64748b">// FLAGSHIP PROJECT :: ARCHITECTURE</text>

    <!-- System Status Badge -->
    <rect x="705" y="-10" width="135" height="20" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="0.8"/>
    <circle cx="717" cy="0" r="3.5" fill="#00f0ff" class="status-pulse"/>
    <text x="726" y="4" class="badge-text">STATUS: ACTIVE</text>
  </g>

  <!-- Left Column: Title & Tech Specs -->
  <g transform="translate(42, 85)">
    <!-- Title with glowing Voxel symbol -->
    <text x="0" y="0" class="mono-title">
      VOXEL<tspan fill="#00f0ff" filter="url(#neonGlow)">⁺</tspan>
      <tspan font-size="14" font-weight="500" fill="#64748b" dx="12">// MINECRAFT LAUNCHER</tspan>
    </text>

    <!-- Description -->
    <text x="0" y="28" class="summary-text">Windows-first desktop launcher engineered for isolated, moddable singleplayer instances.</text>
    <text x="0" y="50" class="summary-text">Each instance maintains a dedicated environment, independent configuration, and isolated game files.</text>

    <!-- Stack Pills -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="94" height="26" rx="5" fill="url(#pillGrad)" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="47" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">ELECTRON</text>

      <rect x="104" y="0" width="108" height="26" rx="5" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="158" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">TYPESCRIPT</text>

      <rect x="222" y="0" width="70" height="26" rx="5" fill="url(#pillGrad)" stroke="#a855f7" stroke-width="0.8"/>
      <text x="257" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">VITE</text>

      <rect x="302" y="0" width="124" height="26" rx="5" fill="url(#pillGrad)" stroke="#c084fc" stroke-width="0.8"/>
      <text x="364" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">FABRIC LOOM</text>

      <rect x="436" y="0" width="86" height="26" rx="5" fill="url(#pillGrad)" stroke="#00f0ff" stroke-width="0.8"/>
      <text x="479" y="17" text-anchor="middle" class="badge-text" fill="#e0f2fe">GRADLE</text>
    </g>
  </g>

  <!-- Right Column: System Capabilities HUD Box -->
  <g transform="translate(595, 70)">
    <rect width="305" height="150" rx="8" fill="#030712" fill-opacity="0.85" stroke="#1e293b" stroke-width="1"/>

    <!-- HUD Header -->
    <rect width="305" height="26" rx="8" fill="#0f172a" fill-opacity="0.8"/>
    <text x="14" y="17" class="badge-text" fill="#38bdf8">&gt; CORE_CAPABILITIES.LOG</text>
    <line x1="0" y1="26" x2="305" y2="26" stroke="#1e293b" stroke-width="1"/>

    <!-- Capabilities List -->
    <g transform="translate(14, 48)">
      <text x="0" y="0" class="feature-text"><tspan fill="#00f0ff">■</tspan> Complete Instance Isolation</text>
      <text x="0" y="24" class="feature-text"><tspan fill="#38bdf8">■</tspan> Fabric, Quilt, Forge, NeoForge</text>
      <text x="0" y="48" class="feature-text"><tspan fill="#a855f7">■</tspan> Offline-First Execution Mode</text>
      <text x="0" y="72" class="feature-text"><tspan fill="#00f0ff">■</tspan> Integrated Modrinth Discovery</text>
      <text x="0" y="96" class="feature-text"><tspan fill="#38bdf8">■</tspan> Java 8 - 25 Auto Detection</text>
    </g>
  </g>

  <!-- Cyber Decorative Corner Brackets -->
  <path d="M 22 36 L 22 22 L 36 22" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 938 36 L 938 22 L 924 22" fill="none" stroke="#00f0ff" stroke-width="2"/>
  <path d="M 22 224 L 22 238 L 36 238" fill="none" stroke="#a855f7" stroke-width="2"/>
  <path d="M 938 224 L 938 238 L 924 238" fill="none" stroke="#a855f7" stroke-width="2"/>

  <!-- Scanning Beam Animation -->
  <g class="scan-beam">
    <line x1="22" y1="0" x2="938" y2="0" stroke="#00f0ff" stroke-width="1" opacity="0.6" filter="url(#neonGlow)"/>
  </g>
</svg>
