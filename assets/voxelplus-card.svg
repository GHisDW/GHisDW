<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 260" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="badgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#162036"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e293b" stroke-width="0.6" stroke-opacity="0.4"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font: bold 26px 'Fira Code', 'Segoe UI', monospace; fill: #ffffff; letter-spacing: 1px; }
    .subtitle { font: 13px 'Fira Code', 'Segoe UI', monospace; fill: #00f5ff; font-weight: 500; }
    .tagline { font: 13px 'Segoe UI', system-ui, sans-serif; fill: #94a3b8; }
    .spec-label { font: bold 11px 'Fira Code', monospace; fill: #38bdf8; }
    .spec-val { font: 11px 'Fira Code', monospace; fill: #cbd5e1; }
    .tag { font: bold 10.5px 'Fira Code', monospace; fill: #e2e8f0; }
    .pulse-dot { animation: pulse 2s infinite ease-in-out; }
    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }
  </style>

  <!-- Background -->
  <rect width="850" height="260" rx="14" fill="url(#cardBg)"/>
  <rect width="850" height="260" rx="14" fill="url(#grid)"/>

  <!-- Outer Border with Neon Accent -->
  <rect width="848" height="258" x="1" y="1" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="848" height="3" x="1" y="1" fill="url(#cyanGlow)" rx="1"/>

  <!-- Terminal Top Bar -->
  <circle cx="25" cy="20" r="5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="59" cy="20" r="5" fill="#10b981"/>
  <text x="80" y="24" font-family="'Fira Code', monospace" font-size="11" fill="#64748b">voxelplus // flagship_module.exe</text>
  <rect x="710" y="12" width="120" height="18" rx="4" fill="#064e3b" fill-opacity="0.5" stroke="#059669" stroke-width="0.8"/>
  <circle cx="722" cy="21" r="3.5" fill="#10b981" class="pulse-dot"/>
  <text x="732" y="24" font-family="'Fira Code', monospace" font-size="10" fill="#34d399" font-weight="bold">STATUS: ACTIVE</text>

  <!-- Divider -->
  <line x1="1" y1="35" x2="849" y2="35" stroke="#1e293b" stroke-width="1"/>

  <!-- VoxelPlus Logo -->
  <g transform="translate(30, 52)">
    <rect width="120" height="120" rx="16" fill="#0d1424" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)"/>
    <image href="data:image/png;base64," x="8" y="8" width="104" height="104" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Project Details -->
  <g transform="translate(175, 62)">
    <text x="0" y="20" class="title">VOXEL⁺ <tspan fill="#a855f7" font-size="20">//</tspan> <tspan font-size="16" fill="#00f5ff">MINECRAFT LAUNCHER</tspan></text>
    <text x="0" y="42" class="subtitle">&gt; Free, offline, isolated singleplayer Minecraft instance manager</text>
    <text x="0" y="64" class="tagline">Engineered for independent Loom &amp; Gradle environments, custom loader support, and zero clutter.</text>

    <!-- Specs Grid -->
    <g transform="translate(0, 80)">
      <!-- Spec Item 1 -->
      <rect x="0" y="0" width="195" height="32" rx="6" fill="url(#badgeBg)" stroke="#1e293b" stroke-width="1"/>
      <text x="10" y="20" class="spec-label">CORE:</text>
      <text x="52" y="20" class="spec-val">Electron + Vite + TS</text>

      <!-- Spec Item 2 -->
      <rect x="205" y="0" width="215" height="32" rx="6" fill="url(#badgeBg)" stroke="#1e293b" stroke-width="1"/>
      <text x="215" y="20" class="spec-label">LOADERS:</text>
      <text x="280" y="20" class="spec-val">Fabric / Quilt / Forge</text>

      <!-- Spec Item 3 -->
      <rect x="430" y="0" width="215" height="32" rx="6" fill="url(#badgeBg)" stroke="#1e293b" stroke-width="1"/>
      <text x="440" y="20" class="spec-label">FEATURES:</text>
      <text x="510" y="20" class="spec-val">Modrinth / Skins / Logs</text>
    </g>
  </g>

  <!-- Bottom Interactive / Feature Pills -->
  <g transform="translate(30, 202)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="28" rx="6" fill="#111827" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <text x="14" y="18" class="tag" fill="#38bdf8">⚡ 100% Offline Ready</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="160" height="28" rx="6" fill="#111827" stroke="#a855f7" stroke-width="1" stroke-opacity="0.6"/>
    <text x="174" y="18" class="tag" fill="#c084fc">📦 Isolated Instances</text>

    <!-- Pill 3 -->
    <rect x="330" y="0" width="155" height="28" rx="6" fill="#111827" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
    <text x="344" y="18" class="tag" fill="#22d3ee">☕ Auto Java Match</text>

    <!-- Pill 4 -->
    <rect x="495" y="0" width="150" height="28" rx="6" fill="#111827" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <text x="509" y="18" class="tag" fill="#34d399">🔄 GitHub Releases</text>

    <!-- Pill 5 / CTA -->
    <rect x="655" y="0" width="165" height="28" rx="6" fill="#00f5ff" fill-opacity="0.15" stroke="#00f5ff" stroke-width="1.2"/>
    <text x="673" y="18" font-family="'Fira Code', monospace" font-size="11" font-weight="bold" fill="#00f5ff">&gt; GHisDW/voxelplus ↗</text>
  </g>
</svg>