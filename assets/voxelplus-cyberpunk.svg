<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="auto">
  <defs>
    <!-- Background Frame -->
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711"/>
      <stop offset="50%" stop-color="#090e21"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>

    <!-- Card Inner Tint -->
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glowing Cyber Borders -->
    <linearGradient id="cyanPurpleRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f3ff"/>
    </linearGradient>

    <!-- Badge Background -->
    <linearGradient id="badgeFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cardGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>

    <!-- Scanline Pattern -->
    <pattern id="subtleScan" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.3"/>
    </pattern>
  </defs>

  <style>
    .mono {
      font-family: 'Courier New', Courier, monospace, 'Fira Code', 'JetBrains Mono', Consolas;
    }
    .sans {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', Helvetica, Arial, sans-serif;
    }
    .project-title {
      font-weight: 800;
      font-size: 28px;
      letter-spacing: 0.5px;
      fill: #ffffff;
    }
    .project-subtitle {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.4px;
      fill: #38bdf8;
    }
    .desc {
      font-size: 13.5px;
      line-height: 1.5;
      fill: #cbd5e1;
    }
    .hud-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      fill: #64748b;
    }
    .hud-val {
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #f8fafc;
    }
    .chip-text {
      font-size: 11.5px;
      font-weight: 600;
      fill: #e2e8f0;
    }
  </style>

  <!-- Background Layer -->
  <rect width="960" height="300" rx="16" fill="url(#cyberBg)"/>
  <rect width="960" height="300" rx="16" fill="url(#cardGrid)"/>

  <!-- Outer HUD Frame with Neon Cyber Accents -->
  <rect x="14" y="14" width="932" height="272" rx="12" fill="url(#innerCard)" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="14" y="14" width="932" height="272" rx="12" fill="none" stroke="url(#cyanPurpleRim)" stroke-width="1.4" stroke-dasharray="160 40 80 30 350 50 120 40" opacity="0.85"/>

  <!-- Corner Brackets -->
  <path d="M 20 32 L 20 20 L 32 20" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 940 32 L 940 20 L 928 20" fill="none" stroke="#00f3ff" stroke-width="2.5"/>
  <path d="M 20 268 L 20 280 L 32 280" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 940 268 L 940 280 L 928 280" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Top Status / Header Breadcrumb -->
  <g transform="translate(36, 38)" class="mono hud-label">
    <text x="0" y="0">MODULE: <tspan fill="#00f3ff">PROJECT_MATRIX</tspan> // TARGET: <tspan fill="#38bdf8">VOXEL_PLUS</tspan> // STATUS: <tspan fill="#34d399">ACTIVE_DEV</tspan></text>
  </g>

  <g transform="translate(730, 26)">
    <rect width="190" height="24" rx="4" fill="#030712" stroke="#a855f7" stroke-width="0.8"/>
    <text x="16" y="16" class="mono" font-size="11" font-weight="700" fill="#c084fc">GHISDW/VOXELPLUS ↗</text>
  </g>

  <!-- Left: App Icon & Brand Badge -->
  <g transform="translate(40, 62)">
    <rect width="116" height="116" rx="16" fill="#090e21" stroke="#334155" stroke-width="1.2"/>
    <rect width="116" height="116" rx="16" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="25 10 50 15" opacity="0.7"/>
    <image href="data:image/png;base64," x="10" y="10" width="96" height="96" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Right: Project Description & Architectural Highlights -->
  <g transform="translate(180, 72)">
    <text x="0" y="20" class="mono project-title">Voxel⁺ <tspan font-size="16" fill="#64748b" font-weight="400">/ Minecraft Launcher</tspan></text>
    <text x="0" y="44" class="sans project-subtitle">Desktop Minecraft launcher engineered for isolated singleplayer instances</text>
    <text x="0" y="66" class="sans desc">Built with Electron &amp; TypeScript. Every instance maintains its own dedicated folder, configuration,</text>
    <text x="0" y="86" class="sans desc">and Gradle/Loom environment so mods, saves, and runtimes never conflict.</text>

    <!-- Specs Matrix -->
    <g transform="translate(0, 108)">
      <!-- Spec 1: Loaders -->
      <g transform="translate(0, 0)">
        <rect width="230" height="42" rx="6" fill="url(#badgeFill)" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="16" class="mono hud-label">SUPPORTED_LOADERS</text>
        <text x="12" y="32" class="mono hud-val" fill="#00f3ff">Fabric · Quilt · Forge · NeoForge</text>
      </g>

      <!-- Spec 2: Runtimes -->
      <g transform="translate(242, 0)">
        <rect width="230" height="42" rx="6" fill="url(#badgeFill)" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="16" class="mono hud-label">JAVA_RUNTIME_DETECTION</text>
        <text x="12" y="32" class="mono hud-val" fill="#38bdf8">Auto Resolver (Java 8 - 25)</text>
      </g>

      <!-- Spec 3: Packs & Discovery -->
      <g transform="translate(484, 0)">
        <rect width="250" height="42" rx="6" fill="url(#badgeFill)" stroke="#1e293b" stroke-width="1"/>
        <text x="12" y="16" class="mono hud-label">CONTENT_SYSTEM</text>
        <text x="12" y="32" class="mono hud-val" fill="#a855f7">Modrinth Browser · VPacks</text>
      </g>
    </g>
  </g>

  <!-- Bottom Telemetry Chips -->
  <g transform="translate(40, 240)">
    <!-- Chip 1: Offline Instances -->
    <g transform="translate(0, 0)">
      <rect width="195" height="26" rx="4" fill="#030712" stroke="#00f3ff" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#00f3ff"/>
      <text x="22" y="17" class="mono chip-text">Offline-First Launching</text>
    </g>

    <!-- Chip 2: Isolated Loom -->
    <g transform="translate(205, 0)">
      <rect width="205" height="26" rx="4" fill="#030712" stroke="#38bdf8" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
      <text x="22" y="17" class="mono chip-text">Independent Instance Loom</text>
    </g>

    <!-- Chip 3: Modpack Engine -->
    <g transform="translate(420, 0)">
      <rect width="215" height="26" rx="4" fill="#030712" stroke="#a855f7" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#a855f7"/>
      <text x="22" y="17" class="mono chip-text">.mrpack &amp; .vpack Importer</text>
    </g>

    <!-- Chip 4: Live Diagnostics -->
    <g transform="translate(645, 0)">
      <rect width="270" height="26" rx="4" fill="#030712" stroke="#34d399" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#34d399"/>
      <text x="22" y="17" class="mono chip-text">Live Minecraft &amp; Gradle Logs</text>
    </g>
  </g>

  <!-- Overlay Scanlines -->
  <rect width="960" height="300" rx="16" fill="url(#subtleScan)" pointer-events="none"/>
</svg>
