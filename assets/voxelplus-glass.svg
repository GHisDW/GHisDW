<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Dark Cyberpunk Canvas Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#0a0f1d"/>
    </linearGradient>

    <!-- Glass Surface -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Neon Cyan & Purple Cyber Rim -->
    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Neon Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00f0ff" stroke-width="0.6" stroke-opacity="0.07"/>
    </pattern>

    <!-- Animated Data Scan Gradient -->
    <linearGradient id="scanLineGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pill Background Gradient -->
    <linearGradient id="pillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Ambient Glow Orbs -->
    <radialGradient id="cyanAura" cx="15%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleAura" cx="85%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 25px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 13.5px;
      fill: #38bdf8;
    }
    .summary-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12.5px;
      line-height: 1.4;
      fill: #94a3b8;
    }
    .spec-header {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 10px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      fill: #00f0ff;
    }
    .spec-body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      fill: #e2e8f0;
    }
    .pill-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11.5px;
      fill: #e2e8f0;
    }
    .terminal-tag {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 10.5px;
      letter-spacing: 0.5px;
      fill: #00f0ff;
    }
    .scan-motion {
      animation: scanAnim 7s ease-in-out infinite alternate;
    }
    @keyframes scanAnim {
      0% { transform: translateY(-40px); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="260" rx="16" fill="url(#cardBg)"/>
  <rect width="960" height="260" rx="16" fill="url(#cyberGrid)"/>
  <rect width="960" height="260" rx="16" fill="url(#cyanAura)"/>
  <rect width="960" height="260" rx="16" fill="url(#purpleAura)"/>

  <!-- Scanning Cyber Beam -->
  <g class="scan-motion">
    <rect x="24" y="0" width="912" height="28" fill="url(#scanLineGrad)"/>
  </g>

  <!-- Main Cyber Glass Card Border & Fill -->
  <rect x="24" y="20" width="912" height="220" rx="14" fill="url(#glassSurface)"/>
  <rect x="24" y="20" width="912" height="220" rx="14" fill="none" stroke="url(#specularRim)" stroke-width="1.2" filter="url(#neonGlow)"/>

  <!-- Terminal Header / Corner Accents -->
  <path d="M 24,36 L 24,20 L 40,20" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 936,36 L 936,20 L 920,20" fill="none" stroke="#00f0ff" stroke-width="2.5"/>
  <path d="M 24,224 L 24,240 L 40,240" fill="none" stroke="#a855f7" stroke-width="2.5"/>
  <path d="M 936,224 L 936,240 L 920,240" fill="none" stroke="#a855f7" stroke-width="2.5"/>

  <!-- Voxel+ App Icon Panel -->
  <g transform="translate(44, 40)">
    <rect width="112" height="112" rx="16" fill="#0c1220" stroke="#1e293b" stroke-width="1"/>
    <rect width="112" height="112" rx="16" fill="none" stroke="url(#specularRim)" stroke-width="1"/>
    <image href="data:image/png;base64," x="8" y="8" width="96" height="96" preserveAspectRatio="xMidYMid meet"/>
    <!-- Status Dot -->
    <circle cx="100" cy="14" r="4" fill="#00f0ff" filter="url(#neonGlow)"/>
  </g>

  <!-- Title & Description Header -->
  <g transform="translate(176, 42)">
    <text x="0" y="20" class="title-text">Voxel⁺ <tspan font-weight="400" font-size="15" fill="#64748b">// FLAGSHIP PROJECT</tspan></text>
    <text x="0" y="42" class="tagline-text">Modern Electron &amp; TypeScript Minecraft Launcher Engine</text>
    <text x="0" y="64" class="summary-text">Engineered for isolated, moddable singleplayer instances with per-instance Gradle &amp; Loom environments.</text>

    <!-- Architecture & Capability Specs (Verified) -->
    <g transform="translate(0, 80)">
      <!-- Spec 1: Architecture -->
      <g transform="translate(0, 0)">
        <rect width="225" height="44" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="16" class="spec-header">Runtime Stack</text>
        <text x="14" y="33" class="spec-body">Electron 39 · Vite 6 · TypeScript</text>
      </g>

      <!-- Spec 2: Loaders -->
      <g transform="translate(237, 0)">
        <rect width="245" height="44" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="16" class="spec-header">Multi-Loader Support</text>
        <text x="14" y="33" class="spec-body">Fabric · Quilt · Forge · NeoForge</text>
      </g>

      <!-- Spec 3: Discovery & Runtimes -->
      <g transform="translate(494, 0)">
        <rect width="245" height="44" rx="8" fill="url(#pillBg)" stroke="#1e293b" stroke-width="1"/>
        <text x="14" y="16" class="spec-header">Content &amp; Java Resolver</text>
        <text x="14" y="33" class="spec-body">Modrinth Browser · Java 8–25 Auto</text>
      </g>
    </g>
  </g>

  <!-- Bottom Cyber Feature Chips -->
  <g transform="translate(42, 190)">
    <!-- Chip 1: Offline Execution -->
    <g transform="translate(0, 0)">
      <rect width="195" height="28" rx="14" fill="#090d16" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="0.9"/>
      <circle cx="14" cy="14" r="3.5" fill="#00f0ff"/>
      <text x="26" y="18" class="pill-label">Offline Instance Launch</text>
    </g>

    <!-- Chip 2: Isolated Loom -->
    <g transform="translate(207, 0)">
      <rect width="205" height="28" rx="14" fill="#090d16" stroke="#a855f7" stroke-opacity="0.4" stroke-width="0.9"/>
      <circle cx="14" cy="14" r="3.5" fill="#a855f7"/>
      <text x="26" y="18" class="pill-label">Per-Instance Loom &amp; Gradle</text>
    </g>

    <!-- Chip 3: Modpack Import -->
    <g transform="translate(424, 0)">
      <rect width="220" height="28" rx="14" fill="#090d16" stroke="#00ff9d" stroke-opacity="0.4" stroke-width="0.9"/>
      <circle cx="14" cy="14" r="3.5" fill="#00ff9d"/>
      <text x="26" y="18" class="pill-label">.mrpack &amp; .vpack Import Engine</text>
    </g>

    <!-- Chip 4: View Project Link -->
    <g transform="translate(656, 0)">
      <rect width="220" height="28" rx="14" fill="#1e1035" stroke="#a855f7" stroke-opacity="0.8" stroke-width="1"/>
      <text x="40" y="18" class="terminal-tag" fill="#a855f7">VIEW REPOSITORY ↗</text>
    </g>
  </g>
</svg>
