<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="auto">
  <defs>
    <!-- Card Base Gradient -->
    <linearGradient id="cyberCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050813"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#080c18"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="cyberCardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8"/>
    </linearGradient>

    <!-- HUD Spec Box Fill -->
    <linearGradient id="specBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Scanline Pattern -->
    <pattern id="cardScanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.3"/>
    </pattern>

    <!-- Micro Grid -->
    <pattern id="cardGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.3px;
      fill: #ffffff;
    }
    .tagline-text {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 13.5px;
      fill: #00f0ff;
    }
    .summary-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 13px;
      line-height: 1.5;
      fill: #94a3b8;
    }
    .spec-header {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 9.5px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      fill: #00f0ff;
    }
    .spec-body {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 600;
      font-size: 12px;
      fill: #f1f5f9;
    }
    .pill-label {
      font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace;
      font-weight: 500;
      font-size: 11px;
      fill: #cbd5e1;
    }
    .pulse-glow {
      animation: pulseAnim 2s infinite alternate ease-in-out;
    }
    @keyframes pulseAnim {
      0% { opacity: 0.5; }
      100% { opacity: 1; }
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="260" rx="14" fill="url(#cyberCardBg)"/>
  <rect width="960" height="260" rx="14" fill="url(#cardGrid)"/>

  <!-- Cybernetic Corner Accents -->
  <path d="M 2 20 L 2 2 L 20 2" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 958 20 L 958 2 L 940 2" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>
  <path d="M 2 240 L 2 258 L 20 258" fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.8"/>
  <path d="M 958 240 L 958 258 L 940 258" fill="none" stroke="#c084fc" stroke-width="2.5" opacity="0.8"/>

  <!-- Main Panel Inner Frame -->
  <rect x="18" y="16" width="924" height="228" rx="10" fill="#080e1b" fill-opacity="0.9"/>
  <rect x="18" y="16" width="924" height="228" rx="10" fill="none" stroke="url(#cyberCardBorder)" stroke-width="1.2"/>
  <rect x="18" y="16" width="924" height="228" rx="10" fill="url(#cardScanlines)" pointer-events="none"/>

  <!-- Top HUD Strip -->
  <line x1="18" y1="42" x2="942" y2="42" stroke="#1e293b" stroke-width="1"/>
  <text x="32" y="34" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="700" fill="#00f0ff" letter-spacing="1">PROJECT://VOXELPLUS</text>
  <text x="760" y="34" font-family="'SF Mono', Consolas, monospace" font-size="10" font-weight="600" fill="#a855f7" letter-spacing="1">ARCH: ELECTRON + TYPESCRIPT</text>

  <!-- App Logo / Icon Frame -->
  <g transform="translate(36, 56)">
    <rect width="102" height="102" rx="12" fill="#0a1222" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.2"/>
    <image href="data:image/png;base64," x="7" y="7" width="88" height="88" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <!-- Title & Description Header -->
  <g transform="translate(154, 56)">
    <text x="0" y="20" class="title-text">Voxel⁺ <tspan font-weight="300" font-size="15" fill="#64748b">::</tspan> <tspan font-weight="500" font-size="15" fill="#38bdf8">Desktop Minecraft Client</tspan></text>
    <text x="0" y="42" class="tagline-text">&gt; Isolated Instances // Offline Launching // Loader-Aware Setup</text>
    <text x="0" y="64" class="summary-text">Electron + TypeScript desktop application for running isolated singleplayer Minecraft environments without file cross-contamination.</text>

    <!-- Architecture & Capability Specs (Verified) -->
    <g transform="translate(0, 80)">
      <!-- Spec 1: Architecture -->
      <g transform="translate(0, 0)">
        <rect width="240" height="42" rx="6" fill="url(#specBg)" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="12" y="16" class="spec-header">ARCHITECTURE</text>
        <text x="12" y="32" class="spec-body">Electron + Vite + TS</text>
      </g>

      <!-- Spec 2: Loaders -->
      <g transform="translate(252, 0)">
        <rect width="255" height="42" rx="6" fill="url(#specBg)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="12" y="16" class="spec-header">LOADER ENGINES</text>
        <text x="12" y="32" class="spec-body">Fabric · Quilt · Forge · NeoForge</text>
      </g>

      <!-- Spec 3: Discovery & Runtimes -->
      <g transform="translate(519, 0)">
        <rect width="245" height="42" rx="6" fill="url(#specBg)" stroke="#c084fc" stroke-opacity="0.35" stroke-width="0.8"/>
        <text x="12" y="16" class="spec-header" fill="#c084fc">DISCOVERY &amp; RUNTIME</text>
        <text x="12" y="32" class="spec-body">Modrinth API · Auto Java (8-25)</text>
      </g>
    </g>
  </g>

  <!-- Bottom Verification Feature Chips -->
  <g transform="translate(36, 196)">
    <!-- Chip 1: Offline Execution -->
    <g transform="translate(0, 0)">
      <rect width="205" height="26" rx="4" fill="#0f172a" stroke="#00f0ff" stroke-opacity="0.4" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#00f0ff"/>
      <text x="22" y="17" class="pill-label">Offline Instance Launch</text>
    </g>

    <!-- Chip 2: Isolated Loom -->
    <g transform="translate(217, 0)">
      <rect width="215" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#38bdf8"/>
      <text x="22" y="17" class="pill-label">Dedicated Loom &amp; Gradle</text>
    </g>

    <!-- Chip 3: Modpack Import -->
    <g transform="translate(444, 0)">
      <rect width="225" height="26" rx="4" fill="#0f172a" stroke="#a855f7" stroke-opacity="0.4" stroke-width="0.8"/>
      <circle cx="12" cy="13" r="3" fill="#c084fc"/>
      <text x="22" y="17" class="pill-label">.mrpack &amp; .vpack Importer</text>
    </g>

    <!-- Chip 4: View Project Link -->
    <g transform="translate(681, 0)">
      <rect width="203" height="26" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="0.8"/>
      <text x="24" y="17" class="pill-label" font-weight="600" fill="#00f0ff">&gt; Repository Link ↗</text>
    </g>
  </g>
</svg>
