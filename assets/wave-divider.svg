<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 40" width="100%" height="auto">
  <defs>
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0"/>
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .ribbon1 {
      animation: waveMove1 12s ease-in-out infinite alternate;
    }
    .ribbon2 {
      animation: waveMove2 16s ease-in-out infinite alternate;
    }
    @keyframes waveMove1 {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-25px); }
    }
    @keyframes waveMove2 {
      0% { transform: translateX(0px); }
      100% { transform: translateX(25px); }
    }
  </style>

  <path class="ribbon1" d="M-50,20 C180,6 380,34 600,18 C780,4 880,30 1010,16" fill="none" stroke="url(#waveGrad1)" stroke-width="1.6"/>
  <path class="ribbon2" d="M-50,24 C160,34 400,10 620,26 C800,38 900,14 1010,22" fill="none" stroke="url(#waveGrad2)" stroke-width="1.2"/>
</svg>
